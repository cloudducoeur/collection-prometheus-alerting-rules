groups:
- name: junos_alerts
  rules:
  #
  # System / Hardware
  #
  - alert: JunosHardwareAlarmRed
    expr: junos_alarms_red_count > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Red alarm active on {{ $labels.instance }}"
      description: "Device {{ $labels.instance }} has {{ $value }} active red alarms."

  - alert: JunosHardwareAlarmYellow
    expr: junos_alarms_yellow_count > 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Yellow alarm active on {{ $labels.instance }}"
      description: "Device {{ $labels.instance }} has {{ $value }} active yellow alarms."

  - alert: JunosHighCpuUsage
    # Adjust threshold as needed (e.g., 80%)
    expr: junos_route_engine_cpu_usage_percent > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on {{ $labels.instance }}"
      description: "CPU usage is at {{ $value }}% on {{ $labels.instance }} (RE {{ $labels.id }})."

  - alert: JunosHighMemoryUsage
    # Adjust threshold as needed (e.g., 85%)
    expr: junos_route_engine_memory_utilization_percent > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High Memory usage on {{ $labels.instance }}"
      description: "Memory usage is at {{ $value }}% on {{ $labels.instance }} (RE {{ $labels.id }})."

  - alert: JunosHighTemperature
    # Threshold depends on device, 55C is a common warning level for intake/ambient
    expr: junos_environment_temperature_celsius > 55
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High temperature on {{ $labels.instance }}"
      description: "Sensor {{ $labels.item }} measures {{ $value }}C on {{ $labels.instance }}."

  - alert: JunosFanFailure
    # Assuming 1 = OK, 0 = Fail (verify with specific exporter version)
    expr: junos_environment_fan_status == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Fan failure on {{ $labels.instance }}"
      description: "Fan {{ $labels.item }} is reporting failure on {{ $labels.instance }}."

  - alert: JunosPowerSupplyFailure
    # Assuming 1 = OK, 0 = Fail (verify with specific exporter version)
    expr: junos_environment_pem_status == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Power supply failure on {{ $labels.instance }}"
      description: "Power supply {{ $labels.item }} is reporting failure on {{ $labels.instance }}."

  #
  # Interfaces
  #
  - alert: JunosInterfaceDown
    # oper_status: 1=up, 2=down. We alert if admin_status=1 (up) but oper_status!=1
    expr: junos_interface_oper_status != 1 and junos_interface_admin_status == 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Interface {{ $labels.target_name }} down on {{ $labels.instance }}"
      description: "Interface {{ $labels.target_name }} is administratively up but operationally down."

  - alert: JunosInterfaceHighErrors
    # Rate of errors > 0.1% (adjust as needed)
    expr: rate(junos_interface_input_errors[5m]) > 0 or rate(junos_interface_output_errors[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Interface errors on {{ $labels.instance }}"
      description: "Interface {{ $labels.target_name }} is seeing errors."

  #
  # BGP
  #
  - alert: JunosBgpSessionDown
    # session_state: 6 = Established. Alert if not 6.
    expr: junos_bgp_session_state != 6
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "BGP session down on {{ $labels.instance }}"
      description: "BGP session with peer {{ $labels.peer_address }} is not established (state: {{ $value }})."

  - alert: JunosBgpPrefixCountLow
    # Alert if prefix count drops below a threshold (example: 10)
    # You might want to make this dynamic or per-peer
    expr: junos_bgp_received_prefix_count < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Low BGP prefix count on {{ $labels.instance }}"
      description: "Peer {{ $labels.peer_address }} is sending only {{ $value }} prefixes."
